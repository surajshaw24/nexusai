<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NexusAI — Advanced AI Assistant</title>
    
    <!-- Valid Manifest & Icon -->
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTmV4dXNBSSIsInNob3J0X25hbWUiOiJOZXh1c0FJIiwiZGVzY3JpcHRpb24iOiJBZHZhbmNlZCBBSSBBc3Npc3RhbnQiLCJzdGFydF91cmwiOiIvIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzZDNUNFNyIsInRoZW1lX2NvbG9yIjoiIzZDNUNFNyJ9">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Real Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --text: #1e293b;
            --text-secondary: #64748b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --input-bg: #f1f5f9;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --radius: 16px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark-mode {
            --primary: #8b5cf6;
            --secondary: #a78bfa;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #334155;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            position: relative;
        }

        /* Hide Scrollbar but keep functionality */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Header */
        .header {
            background: var(--card-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            -webkit-text-fill-color: white;
        }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .header-btn:active { transform: scale(0.92); }
        .header-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--card-bg);
            box-shadow: 0 0 0 1px var(--border);
        }

        /* Chat Container */
        .chat-container {
            height: calc(100dvh - 140px);
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
            position: relative;
        }

        .message {
            margin-bottom: 20px;
            max-width: 85%;
            animation: slideUp 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message { margin-left: auto; align-items: flex-end; }
        .ai-message { margin-right: auto; align-items: flex-start; }

        .message-bubble {
            padding: 14px 18px;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 0.95rem;
            position: relative;
            max-width: 100%;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .user-message .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message .message-bubble {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }

        .message-bubble img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid var(--border);
        }

        .message-meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message:hover .message-actions { opacity: 1; }

        .msg-action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 6px;
            border-radius: 6px;
        }
        .msg-action-btn:hover { background: var(--input-bg); color: var(--primary); }

        /* Markdown & Code Styling */
        .message-bubble pre {
            background: #282c34;
            border-radius: 10px;
            margin: 12px 0;
            overflow: hidden;
        }
        .message-bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        .message-bubble p { margin-bottom: 8px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble ul, .message-bubble ol { margin-left: 20px; margin-bottom: 8px; }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e222a;
            padding: 8px 14px;
            font-size: 0.75rem;
            color: #abb2bf;
            border-bottom: 1px solid #3e4451;
        }
        .copy-code-btn {
            background: transparent;
            border: 1px solid #3e4451;
            color: #abb2bf;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .copy-code-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Typing Indicator */
        .typing-indicator { display: flex; gap: 5px; padding: 4px 0; }
        .typing-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--primary);
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input Area - Mobile Optimized */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); /* iPhone safe area */
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            z-index: 50;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            flex: 1;
            background: var(--input-bg);
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            transition: var(--transition);
            max-height: 120px;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .input-field {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 16px; /* CRITICAL: Prevents iOS auto-zoom */
            outline: none;
            resize: none;
            max-height: 100px;
            padding: 6px 0;
            line-height: 1.5;
            font-family: inherit;
        }
        .input-field::placeholder { color: var(--text-secondary); }

        .input-actions { display: flex; gap: 6px; align-items: center; }

        .input-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition);
        }
        .input-btn:active { transform: scale(0.9); }
        .input-btn:hover { color: var(--primary); background: var(--input-bg); }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }
        .send-btn:hover { color: white; transform: scale(1.05); box-shadow: 0 6px 16px rgba(108, 92, 231, 0.4); }
        .send-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Image Preview */
        .attachment-preview {
            display: none;
            position: absolute;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            box-shadow: var(--shadow);
            z-index: 60;
            border: 1px solid var(--border);
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }
        .attachment-preview img {
            width: 60px; height: 60px; object-fit: cover; border-radius: 10px;
        }
        .attachment-info { flex: 1; overflow: hidden; }
        .attachment-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .attachment-size { font-size: 0.75rem; color: var(--text-secondary); }
        .remove-attachment {
            width: 32px; height: 32px; border-radius: 50%; background: var(--input-bg);
            border: none; color: var(--error); cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }

        /* Sidebar & Backdrop */
        .sidebar-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 89; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; backdrop-filter: blur(2px);
        }
        .sidebar-backdrop.active { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top: 0; left: 0; height: 100dvh; width: 300px;
            background: var(--card-bg); z-index: 90;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%); overflow-y: auto;
            display: flex; flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-header {
            padding: 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-title { font-weight: 700; font-size: 1.1rem; }
        
        .history-list { flex: 1; overflow-y: auto; padding: 12px; }
        .chat-history-item {
            padding: 12px; border-radius: 12px; margin-bottom: 8px;
            cursor: pointer; transition: var(--transition);
            border: 1px solid transparent;
        }
        .chat-history-item:hover { background: var(--input-bg); border-color: var(--border); }
        .chat-history-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-history-time { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }

        .new-chat-btn {
            margin: 16px; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: var(--transition);
        }
        .new-chat-btn:active { transform: scale(0.98); }

        /* Modals */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 200; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); padding: 20px;
        }
        .modal-content {
            background: var(--card-bg); padding: 24px; border-radius: 20px;
            width: 100%; max-width: 400px; box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .close-modal { background: none; border: none; font-size: 1.5rem; color: var(--text-secondary); cursor: pointer; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        .form-input {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
            background: var(--input-bg); color: var(--text); font-size: 16px; outline: none;
        }
        .form-input:focus { border-color: var(--primary); }
        .submit-btn {
            width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
            border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px;
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--text); color: white; padding: 12px 20px; border-radius: 50px;
            z-index: 300; opacity: 0; transition: all 0.3s; display: flex; align-items: center; gap: 8px;
            font-size: 0.9rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }

        /* Floating Action Button (Mobile) */
        .fab {
            position: fixed; bottom: 90px; right: 16px; width: 52px; height: 52px;
            background: var(--primary); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            cursor: pointer; z-index: 40; border: none;
        }
        .fab:active { transform: scale(0.9); }

        /* Responsive */
        @media (max-width: 480px) {
            .sidebar { width: 85vw; }
            .message { max-width: 92%; }
            .header-btn { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar & Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">History</span>
            <button class="header-btn" id="closeSidebar" style="width:32px;height:32px;"><i class="fas fa-times"></i></button>
        </div>
        <div class="history-list" id="historyList"></div>
        <button class="new-chat-btn" id="newChatBtn"><i class="fas fa-plus"></i> New Chat</button>
    </aside>

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            NexusAI
        </div>
        <div class="header-actions">
            <button class="header-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
            <button class="header-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
            <button class="header-btn" id="loginBtn"><i class="fas fa-user"></i></button>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            <div class="message-bubble">
                <p>Hello! I'm <strong>NexusAI</strong>. I'm ready to help you with coding, analysis, or creative tasks.</p>
                <p>Try asking: <em>"Write a Python script to scrape a website"</em> or <em>"Explain quantum computing"</em></p>
            </div>
            <div class="message-meta">Just now</div>
        </div>
    </div>

    <!-- Image Attachment Preview -->
    <div class="attachment-preview" id="attachmentPreview">
        <img id="previewImage" src="" alt="Preview">
        <div class="attachment-info">
            <div class="attachment-name" id="previewName">image.jpg</div>
            <div class="attachment-size" id="previewSize">0 KB</div>
        </div>
        <button class="remove-attachment" id="removeAttachment"><i class="fas fa-trash"></i></button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <button class="input-btn" id="attachBtn" title="Attach"><i class="fas fa-paperclip"></i></button>
        <div class="input-wrapper">
            <textarea class="input-field" id="messageInput" placeholder="Message NexusAI..." rows="1"></textarea>
        </div>
        <button class="input-btn send-btn" id="sendBtn" title="Send"><i class="fas fa-paper-plane"></i></button>
    </div>

    <!-- Voice FAB -->
    <button class="fab" id="voiceBtn" title="Voice Input"><i class="fas fa-microphone"></i></button>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Welcome Back</span>
                <button class="close-modal" id="closeLoginModal">&times;</button>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="loginPassword" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastText">Success</span></div>

    <script>
        // ==========================================
        // 🚀 API INTEGRATION ZONE (YAHAN API LAGAYEN)
        // ==========================================
        async function callRealAPI(conversationHistory) {
            /* 
               INSTRUCTIONS FOR API:
               1. Niche API_URL aur API_KEY mein apni details dalein.
               2. Yeh function standard OpenAI/Anthropic format expect karta hai.
               3. Agar streaming chahiye, toh fetch ko ReadableStream se handle karein.
            */
            
            const API_URL = "https://api.openai.com/v1/chat/completions"; // Apna endpoint yahan dalein
            const API_KEY = "YOUR_API_KEY_HERE"; // Apni API Key yahan dalein

            const payload = {
                model: "gpt-3.5-turbo", // Apna model name dalein
                messages: conversationHistory,
                temperature: 0.7
            };

            try {
                // NOTE: Jab tak aap apni real API key nahi dalte, yeh mock response dega taaki app test ho sake.
                // Jab ready ho, niche ki 'if (API_KEY === "YOUR_API_KEY_HERE")' line hata dena.
                if (API_KEY === "YOUR_API_KEY_HERE") {
                    await new Promise(r => setTimeout(r, 1000)); // Mock delay
                    return "✅ **API Setup Ready!**\n\nAapne API integration zone configure nahi kiya hai. Code mein `callRealAPI` function ke andar apna `API_URL` aur `API_KEY` update karein. \n\nAapka message tha: *" + conversationHistory[conversationHistory.length-1].content + "*";
                }

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `API Error: ${response.status}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;

            } catch (error) {
                console.error("API Call Failed:", error);
                throw new Error("Network error. Please check your API key and connection.");
            }
        }
        // ==========================================
        // END API ZONE
        // ==========================================

        // DOM Elements
        const getEl = (id) => document.getElementById(id);
        const chatContainer = getEl('chatContainer');
        const messageInput = getEl('messageInput');
        const sendBtn = getEl('sendBtn');
        const themeToggle = getEl('themeToggle');
        const sidebar = getEl('sidebar');
        const sidebarBackdrop = getEl('sidebarBackdrop');
        const historyList = getEl('historyList');
        const toast = getEl('toast');
        const toastText = getEl('toastText');
        const attachmentPreview = getEl('attachmentPreview');
        
        let currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 15);
        let isTyping = false;
        let selectedImage = null;
        let conversationHistory = []; // Stores {role: 'user'|'assistant', content: '...'}

        // Initialize Markdown
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        // Utility: Toast
        function showToast(msg, type = 'success') {
            toast.className = `toast ${type}`;
            toastText.textContent = msg;
            toast.querySelector('i').className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Utility: Add Message to UI
        function addMessageToUI(role, text, save = true) {
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user-message' : 'ai-message'}`;
            
            const parsedText = role === 'ai' ? marked.parse(text) : text.replace(/\n/g, '<br>');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            div.innerHTML = `
                <div class="message-bubble">${parsedText}</div>
                <div class="message-meta">
                    <span>${time}</span>
                    <div class="message-actions">
                        <button class="msg-action-btn" onclick="copyText(this)" title="Copy"><i class="fas fa-copy"></i></button>
                        ${role === 'user' ? `<button class="msg-action-btn" onclick="this.closest('.message').remove()" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Apply syntax highlighting to new code blocks
            div.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            if (save) {
                conversationHistory.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
            }
        }

        window.copyText = (btn) => {
            const text = btn.closest('.message').querySelector('.message-bubble').innerText;
            navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
        };

        // Typing Indicator
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message ai-message';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="message-bubble">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                    </div>
                </div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            const el = getEl('typingIndicator');
            if (el) el.remove();
        }

        // Send Message Logic
        async function sendMessage() {
            if (isTyping) return;
            const text = messageInput.value.trim();
            if (!text && !selectedImage) return;

            isTyping = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            let finalText = text;
            if (selectedImage) {
                finalText += `\n\n[Image Attached: ${getEl('previewName').textContent}]`;
                // Note: Real API mein yahan image URL ya base64 payload mein add karein
            }

            addMessageToUI('user', finalText);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            clearAttachment();
            showTyping();

            try {
                const response = await callRealAPI(conversationHistory);
                hideTyping();
                addMessageToUI('ai', response);
                saveToHistory();
            } catch (err) {
                hideTyping();
                addMessageToUI('ai', `⚠️ **Error:** ${err.message}. Please check API configuration.`);
            } finally {
                isTyping = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i>';
                messageInput.focus();
            }
        }

        // Attachment Handling
        getEl('attachBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    selectedImage = file;
                    getEl('previewName').textContent = file.name;
                    getEl('previewSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
                    const reader = new FileReader();
                    reader.onload = (ev) => { getEl('previewImage').src = ev.target.result; };
                    reader.readAsDataURL(file);
                    attachmentPreview.style.display = 'flex';
                }
            };
            input.click();
        });

        getEl('removeAttachment').addEventListener('click', clearAttachment);
        function clearAttachment() {
            selectedImage = null;
            attachmentPreview.style.display = 'none';
            getEl('previewImage').src = '';
        }

        // Input Auto-resize (Mobile Friendly)
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Sidebar & Modal Controls
        function toggleSidebar(open) {
            sidebar.classList.toggle('open', open);
            sidebarBackdrop.classList.toggle('active', open);
        }
        getEl('toggleSidebar').addEventListener('click', () => toggleSidebar(true));
        getEl('closeSidebar').addEventListener('click', () => toggleSidebar(false));
        sidebarBackdrop.addEventListener('click', () => toggleSidebar(false));

        getEl('loginBtn').addEventListener('click', () => getEl('loginModal').style.display = 'flex');
        getEl('closeLoginModal').addEventListener('click', () => getEl('loginModal').style.display = 'none');
        getEl('loginModal').addEventListener('click', (e) => {
            if (e.target === getEl('loginModal')) getEl('loginModal').style.display = 'none';
        });

        getEl('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = getEl('loginEmail').value;
            getEl('userAvatar').textContent = email[0].toUpperCase();
            getEl('loginBtn').style.display = 'none';
            getEl('loginModal').style.display = 'none';
            showToast('Logged in successfully!');
        });

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // Load Saved Theme
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-mode');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        // History Management (Mock LocalStorage)
        function saveToHistory() {
            const title = conversationHistory[0]?.content?.substring(0, 30) + '...' || 'New Chat';
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            if (!history.find(h => h.id === currentSessionId)) {
                history.unshift({ id: currentSessionId, title, date: new Date().toLocaleDateString() });
                localStorage.setItem('chatHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            history.forEach(h => {
                const div = document.createElement('div');
                div.className = 'chat-history-item';
                div.innerHTML = `<div class="chat-history-title">${h.title}</div><div class="chat-history-time">${h.date}</div>`;
                div.addEventListener('click', () => {
                    currentSessionId = h.id;
                    chatContainer.innerHTML = '';
                    conversationHistory = [];
                    addMessageToUI('ai', 'Loaded previous session.');
                    toggleSidebar(false);
                });
                historyList.appendChild(div);
            });
        }

        getEl('newChatBtn').addEventListener('click', () => {
            currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 15);
            conversationHistory = [];
            chatContainer.innerHTML = '';
            addMessageToUI('ai', 'Hello! I\'m NexusAI. How can I help you today?');
            toggleSidebar(false);
        });

        // Voice Input (Web Speech API)
        getEl('voiceBtn').addEventListener('click', () => {
            if (!('webkitSpeechRecognition' in window)) {
                showToast('Voice not supported in this browser', 'error');
                return;
            }
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onstart = () => {
                getEl('voiceBtn').innerHTML = '<i class="fas fa-stop"></i>';
                getEl('voiceBtn').style.background = 'var(--error)';
                showToast('Listening...');
            };
            recognition.onresult = (e) => {
                messageInput.value = e.results[0][0].transcript;
                messageInput.dispatchEvent(new Event('input')); // Trigger auto-resize
            };
            recognition.onend = () => {
                getEl('voiceBtn').innerHTML = '<i class="fas fa-microphone"></i>';
                getEl('voiceBtn').style.background = 'var(--primary)';
            };
            recognition.start();
        });

        // Init
        renderHistory();
        if (conversationHistory.length === 0) {
            // Welcome message already in HTML
        }
    </script>
</body>
</html>
